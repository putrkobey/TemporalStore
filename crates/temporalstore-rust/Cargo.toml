[package]
name = "temporalstore-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust-native TemporalStore engine, storage, client/proxy, and production Raft readiness surfaces."
readme = "README.md"
repository = "https://github.com/matrixarkai/TemporalStore"
homepage = "https://github.com/matrixarkai/TemporalStore"
keywords = ["temporalstore", "database", "storage", "raft", "memory"]
categories = ["database-implementations", "data-structures"]

[dependencies]
async-trait = "0.1"
bytes = "1"
rmp-serde = "1.3"
hex = "0.4"
prost = "0.13"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
sha2 = "0.10"
matrixraft = { package = "matrixraft", git = "https://github.com/matrixarkai/MatrixRaft.git", rev = "8fa64923fd819c4ed23635a75749c53d31702c03" }
matrixcache = { git = "https://github.com/matrixarkai/MatrixCache.git", rev = "5434cd2000251c5813209cd76171770aba1c1afd", features = ["rocksdb-ssd"] }
matrixobjectstore-rs = { git = "https://github.com/matrixarkai/MatrixObject.git", rev = "70bef0aecb649d2128a67c34c2082c4e7ea4f39b", optional = true }
temporalstore-snapshot = { path = "../temporalstore-snapshot" }
thiserror = "1"
