services:
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: temporalstore-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - ./vars-exporter/metrics:/var/lib/node_exporter/textfile_collector
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --collector.processes
