<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatrixArk — mem0 API</title>
<style>
  /* --faint carries the help text under every field, so it is body copy rather than
     decoration: it is set to clear 4.5:1 against --panel in both schemes (measured 4.95
     light / 5.76 dark). A lighter grey looks tidier and drops it to about 3:1. */
  :root{
    --bg:#f2f5f7; --panel:#fff; --panel-2:#f7f9fb;
    --ink:#141a20; --muted:#5c6773; --faint:#667180; --line:#dce3ea;
    --accent:#0d6b68; --accent-ink:#fff; --accent-soft:#d9ecea;
    --ok:#1c7a58; --ok-soft:#dbeee5;
    --warn:#93610f; --warn-soft:#f7ead2;
    --crit:#a6423a; --crit-soft:#f7dfdc;
    --shadow:0 1px 2px rgba(20,26,32,.05), 0 4px 14px rgba(20,26,32,.05);
    --radius:10px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0d1115; --panel:#151b21; --panel-2:#1a212a;
      --ink:#e4e9ef; --muted:#8d99a7; --faint:#8996a5; --line:#27303a;
      --accent:#3fb3a8; --accent-ink:#06231f; --accent-soft:#11302e;
      --ok:#4cb68b; --ok-soft:#113126;
      --warn:#d9a441; --warn-soft:#31270f;
      --crit:#d7756a; --crit-soft:#341e1b;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.28);
    }
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 "IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 72px}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

  /* header */
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:24px;margin:0;letter-spacing:-.015em;font-weight:650}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;
       margin-right:6px;vertical-align:middle}
  .dot.live{background:var(--ok)} .dot.down{background:var(--crit)}
  /* Connected and receiving nothing: not down, which would say a reconnect is the answer,
     and not live, which is what it used to say. */
  .dot.warn{background:var(--warn)}
  .conn{font-size:13px;color:var(--muted)}
  .lede{color:var(--muted);margin:2px 0 22px;max-width:64ch}

  /* summary */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:14px 16px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:26px;line-height:1.1;font-weight:650;
          font-variant-numeric:tabular-nums;font-family:"IBM Plex Mono",monospace}
  .stat span{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
  .stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.crit b{color:var(--crit)}

  section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
          padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  h2{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
     margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:10px}
  h2 .aux{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;font-weight:400}

  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:500}
  input[type=text],input[type=password],textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel-2);color:var(--ink);font:inherit;font-size:14px}
  textarea{min-height:74px;resize:vertical;font-family:"IBM Plex Mono",monospace;font-size:13px}
  input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:620px){.grid2{grid-template-columns:1fr}}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
  button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;
         padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  button.link{background:none;border:0;color:var(--accent);padding:4px 2px;font-weight:500;
              text-decoration:underline;text-underline-offset:2px}
  button.danger{background:transparent;color:var(--crit);border:1px solid var(--crit);
                padding:5px 11px;font-size:13px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}

  .msg{padding:10px 13px;border-radius:7px;font-size:14px;margin-top:14px;line-height:1.5}
  .msg.err{background:var(--crit-soft);color:var(--crit)}
  .msg.ok{background:var(--ok-soft);color:var(--ok)}
  .msg.info{background:var(--accent-soft);color:var(--accent)}
  .note{background:var(--warn-soft);color:var(--warn);padding:10px 13px;border-radius:7px;
        font-size:13.5px;margin-bottom:9px;line-height:1.5}
  /* Config warnings and errors quote long unbreakable tokens (env var names, endpoints, paths).
     Without this they force the whole page to scroll sideways on a narrow viewport. */
  .note,.msg,.hint,td,.job-stats,.lede{overflow-wrap:anywhere}
  .hint{font-size:13px;color:var(--faint);margin-top:9px;line-height:1.5}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
     font-weight:600;white-space:nowrap}
  td.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

  .job{border:1px solid var(--line);border-radius:8px;padding:13px 15px;margin-bottom:10px;
       background:var(--panel-2)}
  .job-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .job-id{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted)}
  .pill{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
        padding:3px 9px;border-radius:20px;white-space:nowrap}
  .pill.running{background:var(--accent-soft);color:var(--accent)}
  .pill.completed{background:var(--ok-soft);color:var(--ok)}
  .pill.queued{background:var(--line);color:var(--muted)}
  .pill.failed,.pill.cancelled{background:var(--crit-soft);color:var(--crit)}
  .job-meta{margin-left:auto;font-size:13px;color:var(--muted);
            font-variant-numeric:tabular-nums}
  .bar{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:11px 0 8px}
  .bar>i{display:block;height:100%;background:var(--accent);transition:width .45s ease}
  .bar>i.done{background:var(--ok)} .bar>i.bad{background:var(--crit)}
  .job-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);
             font-variant-numeric:tabular-nums}
  .job-stats b{color:var(--ink);font-weight:600}
  .current{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint);
           margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  details{margin-top:9px}
  summary{cursor:pointer;font-size:13px;color:var(--crit)}
  details ul{margin:7px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted)}
  details li{margin-bottom:3px;font-family:"IBM Plex Mono",monospace;word-break:break-all}

  pre{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:12px 14px;
      overflow-x:auto;font-size:12.5px;margin:0;line-height:1.5}
  .empty{color:var(--faint);font-size:14px;padding:6px 0}
.spark{margin:0 0 10px}
.spark figcaption{font-size:12px;color:var(--faint);margin-bottom:2px}
.spark svg{width:100%;height:56px;display:block;opacity:.85}
  .enc{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:9px;
       background:var(--panel-2)}
  .enc.active{border-color:var(--accent);background:var(--accent-soft)}
  .enc-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
  .enc-name{font-weight:600}
  .enc-nums{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);
            font-variant-numeric:tabular-nums}
  .enc-nums b{color:var(--ink);font-weight:600}
  .enc-note{font-size:13px;color:var(--faint);margin-top:7px;line-height:1.5}
  .enc-cfg{margin-top:9px} .enc-cfg pre{margin:0;font-size:12px}
  a{color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  .lineage{font-size:12.5px;color:var(--muted);margin-top:7px}
  .lineage .mono{font-family:"IBM Plex Mono",monospace}
  table.failures{margin-top:8px;font-size:13px}
  table.failures td{vertical-align:top;overflow-wrap:anywhere}
  table.failures td.mono{font-family:"IBM Plex Mono",monospace;font-size:12px}
  details ul li{list-style:none;margin-left:-18px}
  /* Named for a screen reader, absent for everyone else. The heading beside a control can
     already say what it is for, in which case a second visible copy is noise -- but a
     heading is not a name, and announced on its own the control has none. Clipped rather
     than display:none, which would take it out of the accessibility tree as well. */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
           clip:rect(0 0 0 0);white-space:nowrap;border:0}
  /* A warning is a third thing, between "this went wrong" and "here is a note".
     .msg.err, .msg.ok and .msg.info were defined on every page and this one on none, so five
     messages that asked for it -- including the two that gate a destructive operation, and the one
     saying every refusal is being discarded -- were drawn as ordinary notes. The variables were
     already here; only the rule that spends them was missing. */
  .msg.warn{background:var(--warn-soft);color:var(--warn)}
  /* shared portal nav (same markup on every page; both portal stylesheets define these vars) */
  .portalnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px;padding-bottom:2px;
             border-bottom:1px solid var(--line)}
  .portalnav a{display:inline-block;padding:7px 12px;font-size:13.5px;font-weight:550;
               text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;
               margin-bottom:-1px}
  .portalnav a:hover{color:var(--accent)}
  .portalnav a[aria-current=page]{color:var(--accent);border-bottom-color:var(--accent)}
  .livestrip{display:flex;gap:14px;align-items:center;margin-left:auto;padding-bottom:7px;
             flex-wrap:wrap}
  .subhead{font-size:13px;font-weight:650;margin:18px 0 0;letter-spacing:.01em}
  /* A section heading whose row also carries a control.

     The control used to sit INSIDE the h2. A heading's accessible name is its contents, so the
     heading announced itself as "Grafana copy scrape config", or "Access remember for this
     browser tab" -- and moving through a long page by heading is how that name gets used. The
     row is unchanged: these properties are the ones the h2 was carrying, the heading keeps its
     own type, and .aux is still pushed right. The colour is restated because .aux used to
     inherit it from the heading it sat in. */
  .sechead{display:flex;align-items:center;gap:10px;margin:0 0 14px}
  .sechead>h1,.sechead>h2,.sechead>h3,.sechead>h4{margin:0}
  .sechead>.aux{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12px;
                font-weight:400;color:var(--muted)}
  .status-chip{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;
      padding:0 5px;border-radius:4px;background:var(--card);margin-right:4px;
      font-variant-numeric:tabular-nums}
  .status-chip.bad{background:var(--danger-bg);color:var(--danger)}
  .live-seg{display:inline-flex;gap:5px;align-items:baseline;font-size:12.5px;color:var(--muted);
            text-decoration:none;border-bottom:0;padding:0;font-weight:400;
            font-variant-numeric:tabular-nums}
  .live-seg:hover{color:var(--accent)}
  .live-seg b{font-weight:650;color:var(--ink)}
  .live-seg.warn b{color:var(--warn)}
  .live-seg.busy b{color:var(--accent)}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto}
  .calllog{margin:0 0 18px;max-height:340px;overflow:auto;border:1px solid var(--line);
           border-radius:8px}
  .calllog table{width:100%;border-collapse:collapse;font-size:12.5px;
                 font-variant-numeric:tabular-nums}
  .calllog th,.calllog td{text-align:left;padding:5px 9px;border-bottom:1px solid var(--line)}
  .calllog td.mono{font-family:"IBM Plex Mono",monospace;font-size:11.5px}
  .calllog tr.bad td{color:var(--crit)}
  .live-dot.stale{background:var(--warn)}
  .live-dot.down{background:var(--crit)}
  @media (max-width:820px){ .livestrip{margin-left:0;width:100%;padding-top:6px} }

  /* setup + catalog additions */
  .field{margin-bottom:2px}
  .field .env{font-size:11.5px;color:var(--faint);font-family:"IBM Plex Mono",monospace}
  .badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
         padding:2px 7px;border-radius:20px;margin-left:7px;white-space:nowrap}
  .badge.restart{background:var(--warn-soft);color:var(--warn)}
  .badge.essential{background:var(--crit-soft);color:var(--crit)}
  /* Louder than .restart on purpose: that one is advice about a kind of setting, this one is a
     deployment running something other than what this page shows. */
  .badge.pending{background:var(--crit-soft);color:var(--crit)}
  .badge.portal{background:var(--accent-soft);color:var(--accent)}
  .badge.environment{background:var(--line);color:var(--muted)}
  .badge.override{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
  select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;
         background:var(--panel-2);color:var(--ink);font:inherit;font-size:14px}
  .presets{display:flex;gap:8px;flex-wrap:wrap}
  .preset{flex:1 1 210px;text-align:left;background:var(--panel-2);color:var(--ink);
          border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-weight:500}
  .preset b{display:block;font-weight:650;margin-bottom:3px}
  .preset span{display:block;font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.45}
  .preset:hover{border-color:var(--accent)}
  .probe{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:9px;
         background:var(--panel-2)}
  .probe.ok{border-color:var(--ok)} .probe.bad{border-color:var(--crit)}
  .probe h3{margin:0 0 5px;font-size:14px;font-weight:650;display:flex;gap:9px;align-items:center}
  .probe p{margin:0;font-size:13px;color:var(--muted)}
  tr.rowlink{cursor:pointer} tr.rowlink:hover td{background:var(--panel-2)}
  .tag{font-size:11px;background:var(--line);color:var(--muted);border-radius:4px;padding:1px 6px;
       margin-right:5px;white-space:nowrap}
  /* setup page: grouped, filterable settings */
  details.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
                padding:0;margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  details.group>summary{list-style:none;cursor:pointer;padding:15px 20px;display:flex;
                        align-items:baseline;gap:10px;flex-wrap:wrap}
  details.group>summary::-webkit-details-marker{display:none}
  details.group>summary::before{content:"B8";color:var(--faint);font-size:12px;
                                transition:transform .15s ease;display:inline-block}
  details.group[open]>summary::before{transform:rotate(90deg)}
  details.group>summary b{font-size:15px;font-weight:650;letter-spacing:-.01em}
  details.group>summary .n{font-size:11.5px;color:var(--faint);
                           font-family:"IBM Plex Mono",monospace}
  details.group>summary .adv{font-size:10px;font-weight:700;text-transform:uppercase;
                             letter-spacing:.05em;color:var(--muted);background:var(--line);
                             border-radius:20px;padding:2px 7px}
  details.group>summary .dirty{font-size:10px;font-weight:700;text-transform:uppercase;
                               letter-spacing:.05em;color:var(--warn);background:var(--warn-soft);
                               border-radius:20px;padding:2px 7px}
  .group-body{padding:0 20px 18px}
  .group-note{color:var(--muted);font-size:13.5px;margin:0 0 14px;max-width:70ch;line-height:1.55}
  .field.changed input,.field.changed select{border-color:var(--warn);
                                             background:var(--warn-soft)}
  .field .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .field .reset{margin-left:auto}
  .field.hidden{display:none}
  .helptext{font-size:13px;color:var(--faint);margin-top:9px;line-height:1.5;max-width:70ch}
  .helptext.long{max-height:3.6em;overflow:hidden;position:relative;cursor:pointer}
  .helptext.long::after{content:"more";position:absolute;right:0;bottom:0;background:var(--panel);
                        padding-left:10px;color:var(--accent);font-weight:600}
  .helptext.long.open{max-height:none}
  .helptext.long.open::after{content:none}
  .savebar{position:sticky;bottom:0;z-index:5;background:var(--panel);border:1px solid var(--line);
           border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;margin:16px 0;
           display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .savebar .count{font-size:13.5px;color:var(--muted);margin-right:auto}
  .savebar .count b{color:var(--warn)}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar input[type=text]{flex:1 1 240px;width:auto}
  /* A table whose row headers cannot wrap is as wide as its widest header, and without this the
     page body carries that width: at 375px this page's document scrolled to 579px. The table
     scrolls inside its own panel instead. */
  .tablewrap{overflow-x:auto;max-width:100%}
  /* The table must be allowed to EXCEED the wrapper, or the wrapper has nothing to scroll and the
     table squeezes instead. `.inv` is width:100%, which a browser treats as preferred and exceeds
     only as far as minimum content widths force -- and `.inv th` is nowrap while `.inv td` breaks
     anywhere, so the settled shape is "row header in full, value in a sliver". Measured at 271px
     before this rule: a 199px header, a 7px value cell, and one row 865px tall. */
  .tablewrap .inv{min-width:28rem}
  .inv{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:16px}
  .inv th{width:1%;white-space:nowrap;text-align:left;padding:6px 14px 6px 0;font-weight:500;
          color:var(--muted);text-transform:none;letter-spacing:0;font-size:13.5px}
  .inv td{padding:6px 0;border-bottom:1px solid var(--line);
          font-family:"IBM Plex Mono",monospace;font-size:12.5px;overflow-wrap:anywhere}
  .inv td.unset{color:var(--faint);font-style:italic;font-family:inherit}
  .inv .envname{display:block;font-size:11px;color:var(--faint);
                font-family:"IBM Plex Mono",monospace}
  #history td div{font-family:"IBM Plex Mono",monospace;font-size:12.5px;padding:1px 0;
                  overflow-wrap:anywhere}
  #history em{font-style:normal;color:var(--muted)}
  /* overview checklist + explore */
  .checkrow{display:flex;gap:13px;align-items:flex-start;padding:13px 0;
            border-bottom:1px solid var(--line)}
  .checkrow:last-child{border-bottom:0}
  .checkrow .mark{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;
                  font-size:12px;font-weight:800;margin-top:1px}
  .checkrow .mark.ok{background:var(--ok-soft);color:var(--ok)}
  .checkrow .mark.warn{background:var(--warn-soft);color:var(--warn)}
  .checkrow .mark.todo{background:var(--crit-soft);color:var(--crit)}
  .checkrow .body{flex:1 1 auto;min-width:0}
  .checkrow .body b{display:block;font-size:14.5px;font-weight:650;margin-bottom:2px}
  .checkrow .body span{font-size:13.5px;color:var(--muted);line-height:1.5;
                       overflow-wrap:anywhere;display:block}
  .checkrow .go{flex:0 0 auto;font-size:13px;white-space:nowrap}
  .importrow{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:9px;
             background:var(--panel-2)}
  .importhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .importhead .mono{font-family:"IBM Plex Mono",monospace;font-size:12.5px}
  .importmeta{margin-left:auto;font-size:12.5px;color:var(--muted);
              font-variant-numeric:tabular-nums}
  .importcur{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);
             margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .how{margin-top:8px}
  .how>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:550;
               list-style:none;display:inline-block}
  .how>summary::-webkit-details-marker{display:none}
  .how>summary::before{content:"B8 ";font-size:10px}
  .how[open]>summary::before{content:"BE "}
  .how ol{margin:8px 0 0;padding-left:20px}
  .how li{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:5px;
          overflow-wrap:anywhere}
  .progress{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:4px 0 18px}
  .progress>i{display:block;height:100%;background:var(--ok);transition:width .5s ease}
