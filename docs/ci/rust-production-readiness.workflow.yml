name: Rust production readiness

on:
  pull_request:
    branches:
      - rust-main
  push:
    branches:
      - rust-main
  workflow_dispatch:

jobs:
  rust-production-readiness:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Validate unified conformance corpus
        run: python3 tools/run_temporalstore_unified_tests.py --validate-only

      - name: Validate readiness workflow coverage
        run: python3 tools/validate_readiness_workflow.py

      - name: Compile all Rust targets
        run: cargo check -p temporalstore-rust --all-targets

      - name: Run unified Rust corpus
        run: tools/run_temporalstore_unified_tests.sh

      - name: Run unified local validation
        run: bash tools/run_temporalstore_unified_validation.sh

      - name: Run Rust unit and integration tests
        run: cargo test -p temporalstore-rust --lib --tests -- --test-threads=1

      - name: Capture production readiness report
        shell: bash
        run: |
          set +e
          mkdir -p target/readiness
          cargo run -p temporalstore-rust --bin readiness_gate -- --service-reports \
            > target/readiness/production_readiness_report.json \
            2> target/readiness/production_readiness_gate.log
          status=$?
          set -e
          cat target/readiness/production_readiness_gate.log
          python3 - <<'PY'
          import json
