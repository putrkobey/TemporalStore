<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatrixArk LOCOMO Benchmark Walkthrough</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #586174;
      --line: #dbe3ef;
      --soft: #f6f8fb;
      --accent: #0f766e;
      --accent2: #a16207;
      --code: #0f172a;
    }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fff;
      line-height: 1.55;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 28px 64px;
    }
    h1 {
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.04;
      letter-spacing: 0;
      margin: 0 0 14px;
    }
    h2 {
      border-top: 1px solid var(--line);
      padding-top: 28px;
      margin-top: 34px;
      font-size: 24px;
    }
    h3 { margin-top: 28px; font-size: 19px; }
    p, li { font-size: 16px; }
    .lede {
      max-width: 820px;
      color: var(--muted);
      font-size: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
      margin: 18px 0;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      background: var(--soft);
    }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      background: #ecfdf5;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0 24px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 10px 12px;
      vertical-align: top;
    }
    th { background: var(--soft); text-align: left; }
    pre {
      overflow-x: auto;
      background: #0f172a;
      color: #e5e7eb;
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
    }
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      color: var(--code);
      background: #eef2f7;
      padding: 1px 4px;
